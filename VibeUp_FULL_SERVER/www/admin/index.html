<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>VibeUp — Админка</title><style>body{margin:0;background:#0b0b0e;color:#fff;font-family:system-ui;padding:20px}main{max-width:800px;margin:auto}.box{background:#151519;border:1px solid #292930;border-radius:16px;padding:20px;margin-bottom:18px}h1{margin-top:0}label{display:block;margin:11px 0 5px;color:#aaa}input{width:100%;box-sizing:border-box;padding:11px;border-radius:10px;border:1px solid #333;background:#202027;color:#fff}button{margin-top:12px;padding:11px 16px;border:0;border-radius:10px;background:#e11d48;color:white;font-weight:750;cursor:pointer}.track{display:flex;gap:12px;align-items:center;border-top:1px solid #292930;padding:12px 0}.cover{width:58px;height:58px;object-fit:cover;border-radius:8px;background:#222}.meta{flex:1;min-width:0}.muted{color:#999;font-size:13px}.delete{background:#7f1d1d;margin:0}.edit{background:#333;margin:0;margin-right:6px}.row{display:flex;gap:8px}.row>*{flex:1}.status{margin-top:10px;color:#aaa;font-size:13px}</style></head><body><main><div class="box"><h1>VibeUp Admin</h1><label>Админ-ключ</label><input id="adminKey" type="password" placeholder="Ключ backend"><button id="saveKey">Сохранить ключ</button><div id="authStatus" class="status"></div><p class="muted">Добавляй музыку в общую библиотеку — APK пересобирать не нужно. Если на ПК задан VIBEUP_YANDEX_TOKEN, файлы автоматически публикуются в облачной библиотеке.</p><div id="cloudStatus" class="status">Проверяю облако…</div><div id="catalogUrl" class="status"></div><form id="form"><label>Название *</label><input id="title" required><label>Исполнитель</label><input id="artist"><label>Альбом</label><input id="album"><div class="row"><div><label>Жанр</label><input id="genre"></div><div><label>Год</label><input id="year" type="number"></div></div><label>Аудиофайл</label><input id="audio" type="file" accept=".mp3,.wav,.flac,.m4a,.ogg,.aac" required><label>Обложка</label><input id="cover" type="file" accept=".jpg,.jpeg,.png,.webp"><button>Добавить трек</button><div id="status" class="status"></div></form></div><div class="box"><h2>Музыка</h2><div id="list"></div></div></main><script>
const base=location.origin,$=id=>document.getElementById(id),list=$('list');
$('adminKey').value=sessionStorage.getItem('vibeup_admin_key')||'';
$('saveKey').onclick=()=>{sessionStorage.setItem('vibeup_admin_key',$('adminKey').value.trim());check();load()};
const key=()=>sessionStorage.getItem('vibeup_admin_key')||'';
const hdr=()=>key()?{'x-vibeup-admin-key':key()}:{}; 
async function check(){try{const x=await(await fetch(base+'/api/health')).json();$('cloudStatus').textContent=x.cloud?'☁️ Облако подключено':'⚠️ Облако не подключено';$('authStatus').textContent=x.admin?'🔐 Админ-ключ backend настроен':'⚠️ VIBEUP_ADMIN_KEY не задан';}catch{$('cloudStatus').textContent='Нет связи с сервером'}}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
async function load(){try{const r=await fetch(base+'/api/tracks',{cache:'no-store'});const ts=await r.json();list.innerHTML=ts.length?'':'<p class="muted">Пока пусто</p>';ts.forEach(t=>{const d=document.createElement('div');d.className='track';d.innerHTML=(t.cover?'<img class="cover" src="'+base+t.cover+'">':'<div class="cover">🎵</div>')+'<div class="meta"><b>'+esc(t.title)+'</b><div class="muted">'+esc(t.artist)+(t.album?' · '+esc(t.album):'')+'</div></div><button class="edit">Изменить</button><button class="delete">Удалить</button>';d.querySelector('.delete').onclick=async()=>{if(!confirm('Удалить трек?'))return;const r=await fetch(base+'/api/tracks/'+t.id,{method:'DELETE',headers:hdr()});const d=await r.json();if(!r.ok)alert(d.error||'Ошибка');load()};d.querySelector('.edit').onclick=async()=>{const title=prompt('Название',t.title);if(title===null)return;const artist=prompt('Исполнитель',t.artist);if(artist===null)return;const r=await fetch(base+'/api/tracks/'+t.id,{method:'PATCH',headers:{...hdr(),'Content-Type':'application/json'},body:JSON.stringify({title,artist})});const d=await r.json();if(!r.ok)alert(d.error||'Ошибка');load()};list.appendChild(d)})}catch{list.innerHTML='<p class="muted">Нет связи с сервером</p>'}}
$('form').onsubmit=async e=>{e.preventDefault();$('status').textContent='Загрузка...';const fd=new FormData();fd.append('title',$('title').value);fd.append('artist',$('artist').value);fd.append('album',$('album').value);fd.append('genre',$('genre').value);fd.append('year',$('year').value);fd.append('audio',$('audio').files[0]);if($('cover').files[0])fd.append('cover',$('cover').files[0]);try{const r=await fetch(base+'/api/tracks',{method:'POST',headers:hdr(),body:fd});const data=await r.json();if(!r.ok)throw new Error(data.error||'Ошибка');e.target.reset();$('status').textContent=data.cloud?'✓ Загружено в облако, каталог обновлён':'✓ Добавлено локально — облако не подключено';load()}catch(err){$('status').textContent='Ошибка: '+err.message}};
check();load();
</script></body></html>
